# Plushables (plushables) Config

# Allows players to insert and extract items from plushables. Setting this to false won't delete items inside existing plushables. Default: true.
enable_storage_system=true

# Allows powered plushables containing TNT to explode. Default: true.
enable_stored_tnt_explosions=true

# Adds plushables and Hearts of Gold to vanilla loot tables. Default: true.
enable_loot_table_population=true

