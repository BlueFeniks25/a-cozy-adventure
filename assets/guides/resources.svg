<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Ressourcenpakete: oben hat Vorrang</title><desc id="desc">Von oben nach unten: Fresh Animations Extensions, Player Extension, Fresh Animations, Colorful Trims RP, Standard. Schema des Minecraft-Menüs.</desc><rect width="900" height="530" rx="24" fill="#15221d"/><g font-family="system-ui,sans-serif"><text x="32" y="40" fill="#bfd392" font-size="13" letter-spacing="2">SCHEMA · MINECRAFT-RESSOURCENPAKET-MENÜ</text><text x="32" y="86" fill="#e6e9dd" font-size="30">Oben gewinnt. Unten ist die Basis.</text><path d="M58 410V135m-12 18 12-18 12 18" stroke="#dfbd7b" stroke-width="3" fill="none"/><rect x="94" y="110" width="774" height="59" rx="9" fill="#31462c" stroke="#526647"/><text x="112" y="134" fill="#e6e9dd" font-size="17">01  Fresh Animations Extensions</text><text x="145" y="155" fill="#b5c2af" font-size="12">FA+All_Extensions-v1.9.2.zip</text><rect x="94" y="179" width="774" height="59" rx="9" fill="#2b3e29" stroke="#526647"/><text x="112" y="203" fill="#e6e9dd" font-size="17">02  Fresh Animations – Player Extension</text><text x="145" y="224" fill="#b5c2af" font-size="12">FA+Player-v1.1.zip</text><rect x="94" y="248" width="774" height="59" rx="9" fill="#263828" stroke="#526647"/><text x="112" y="272" fill="#e6e9dd" font-size="17">03  Fresh Animations</text><text x="145" y="293" fill="#b5c2af" font-size="12">FreshAnimations_v1.10.5.zip</text><rect x="94" y="317" width="774" height="59" rx="9" fill="#203025" stroke="#526647"/><text x="112" y="341" fill="#e6e9dd" font-size="17">04  Colorful Trims RP</text><text x="145" y="362" fill="#b5c2af" font-size="12">Colorful Trims RP v2.0.zip</text><rect x="94" y="386" width="774" height="59" rx="9" fill="#192b22" stroke="#526647"/><text x="112" y="410" fill="#e6e9dd" font-size="17">05  Standard / Default</text><text x="145" y="431" fill="#b5c2af" font-size="12">Minecraft-Basis</text><text x="32" y="493" fill="#b5c2af" font-size="13">Startvorgabe für neue Instanzen · Deine eigene Auswahl und Reihenfolge bleibt erhalten.</text></g></svg>