<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Optionale Mods – Schema</title><desc id="desc">Instanz bearbeiten → ☑ ColorLight → ☐ → ☐ ColorLight → ☑. Schematische Darstellung, kein Prism-Screenshot.</desc><rect width="900" height="430" rx="24" fill="#15221d"/><path d="M0 360Q180 280 380 355T900 315V430H0Z" fill="#20362a"/><g font-family="system-ui,sans-serif"><text x="32" y="40" fill="#bfd392" font-size="13" letter-spacing="2">A COZY ADVENTURE · SPIELERWEGWEISER</text><text x="32" y="85" fill="#e6e9dd" font-size="30">Deine Auswahl bleibt deine.</text><g transform="translate(32,120)"><rect width="264" height="240" rx="14" fill="#192b22" stroke="#526647"/><circle cx="33" cy="34" r="18" fill="#bfd392"/><text x="33" y="39" text-anchor="middle" fill="#18271d" font-size="14" font-weight="700">01</text><path d="M20 74H244" stroke="#3b5140"/><text x="20" y="109" fill="#e6e9dd" font-size="16" font-weight="600">Instanz bearbeiten</text><text x="20" y="146" fill="#bfd392" font-size="14">Edit → Mods</text><text x="20" y="184" fill="#c0cbb7" font-size="12">Minecraft vorher schließen</text><path d="M20 210H90" stroke="#dfbd7b" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(318,120)"><rect width="264" height="240" rx="14" fill="#192b22" stroke="#526647"/><circle cx="33" cy="34" r="18" fill="#bfd392"/><text x="33" y="39" text-anchor="middle" fill="#18271d" font-size="14" font-weight="700">02</text><path d="M20 74H244" stroke="#3b5140"/><text x="20" y="109" fill="#e6e9dd" font-size="16" font-weight="600">☑ ColorLight → ☐</text><text x="20" y="146" fill="#bfd392" font-size="14">Häkchen aus: deaktiviert</text><text x="20" y="184" fill="#c0cbb7" font-size="12">Nur offizielle optionale Mods</text><path d="M20 210H135" stroke="#dfbd7b" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(604,120)"><rect width="264" height="240" rx="14" fill="#192b22" s