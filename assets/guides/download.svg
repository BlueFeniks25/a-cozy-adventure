<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Eigene Mods – Schema</title><desc id="desc">Mods → Download Mods → Version prüfen → Auswahl herunterladen. Schematische Darstellung, kein Prism-Screenshot.</desc><rect width="900" height="430" rx="24" fill="#15221d"/><path d="M0 360Q180 280 380 355T900 315V430H0Z" fill="#20362a"/><g font-family="system-ui,sans-serif"><text x="32" y="40" fill="#bfd392" font-size="13" letter-spacing="2">A COZY ADVENTURE · SPIELERWEGWEISER</text><text x="32" y="85" fill="#e6e9dd" font-size="30">Ein neues Detail für deine Welt.</text><g transform="translate(32,120)"><rect width="264" height="240" rx="14" fill="#192b22" stroke="#526647"/><circle cx="33" cy="34" r="18" fill="#bfd392"/><text x="33" y="39" text-anchor="middle" fill="#18271d" font-size="14" font-weight="700">01</text><path d="M20 74H244" stroke="#3b5140"/><text x="20" y="109" fill="#e6e9dd" font-size="16" font-weight="600">Mods → Download Mods</text><text x="20" y="146" fill="#bfd392" font-size="14">Modrinth / CurseForge</text><text x="20" y="184" fill="#c0cbb7" font-size="12">Gewünschte Mod suchen</text><path d="M20 210H90" stroke="#dfbd7b" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(318,120)"><rect width="264" height="240" rx="14" fill="#192b22" stroke="#526647"/><circle cx="33" cy="34" r="18" fill="#bfd392"/><text x="33" y="39" text-anchor="middle" fill="#18271d" font-size="14" font-weight="700">02</text><path d="M20 74H244" stroke="#3b5140"/><text x="20" y="109" fill="#e6e9dd" font-size="16" font-weight="600">Version prüfen</text><text x="20" y="146" fill="#bfd392" font-size="14">Minecraft 26.3 · Fabric</text><text x="20" y="184" fill="#c0cbb7" font-size="12">Abhängigkeiten mitprüfen</text><path d="M20 210H135" stroke="#dfbd7b" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(604,120)"><rect width="264" height="240" rx="14" fill="#192